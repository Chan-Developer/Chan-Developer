<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Current engineering focus</title>
  <desc id="desc">Reliability, evidence, and productization are the three current engineering priorities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e53935"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="210" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="208" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>
  <rect x="48" y="43" width="4" height="124" rx="2" fill="url(#line)"/>
  <text x="78" y="58" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">CURRENT ENGINEERING FOCUS</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="78" y="105" fill="#f0f6fc" font-size="22" font-weight="700">RELIABILITY</text>
    <text x="78" y="132" fill="#8b949e" font-size="14">Failure-driven evaluation</text>
    <text x="78" y="153" fill="#8b949e" font-size="14">Specialist review loops</text>

    <text x="438" y="105" fill="#f0f6fc" font-size="22" font-weight="700">EVIDENCE</text>
    <text x="438" y="132" fill="#8b949e" font-size="14">Isolated visual evidence</text>
    <text x="438" y="153" fill="#8b949e" font-size="14">Inspectable decision traces</text>

    <text x="798" y="105" fill="#f0f6fc" font-size="22" font-weight="700">PRODUCTIZATION</text>
    <text x="798" y="132" fill="#8b949e" font-size="14">Maintainable model services</text>
    <text x="798" y="153" fill="#8b949e" font-size="14">Deployment and observability</text>
  </g>

  <g fill="#e53935">
    <circle cx="405" cy="116" r="3"/>
    <circle cx="765" cy="116" r="3"/>
  </g>
</svg>

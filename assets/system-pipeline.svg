<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first multimodal AI system pipeline</title>
  <desc id="desc">Visual input flows through understanding, detection, specialist review, and deterministic guardrails to produce traceable output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4f"/>
      <stop offset="1" stop-color="#e53935"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="230" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="228" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>
  <text x="52" y="47" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">EVIDENCE-FIRST PIPELINE</text>
  <text x="1148" y="47" fill="#8b949e" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13">observable · reviewable · traceable</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="52" y="82" width="170" height="92" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="274" y="82" width="170" height="92" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="496" y="82" width="170" height="92" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="718" y="82" width="170" height="92" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="940" y="82" width="208" height="92" rx="9" fill="#1b1516" stroke="#e53935"/>
  </g>

  <g fill="none" stroke="#484f58" stroke-width="2">
    <path d="M222 128h46"/>
    <path d="M444 128h46"/>
    <path d="M666 128h46"/>
    <path d="M888 128h46"/>
  </g>
  <g fill="#e53935">
    <path d="M268 128l-9-6v12z"/>
    <path d="M490 128l-9-6v12z"/>
    <path d="M712 128l-9-6v12z"/>
    <path d="M934 128l-9-6v12z"/>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="83" cy="111" r="13" fill="url(#accent)"/>
    <text x="83" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">01</text>
    <text x="73" y="145" fill="#f0f6fc" font-size="16" font-weight="700">VISUAL INPUT</text>
    <text x="73" y="163" fill="#8b949e" font-size="12">image · video · document</text>

    <circle cx="305" cy="111" r="13" fill="url(#accent)"/>
    <text x="305" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">02</text>
    <text x="295" y="145" fill="#f0f6fc" font-size="16" font-weight="700">UNDERSTAND</text>
    <text x="295" y="163" fill="#8b949e" font-size="12">VLM · OCR · semantics</text>

    <circle cx="527" cy="111" r="13" fill="url(#accent)"/>
    <text x="527" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">03</text>
    <text x="517" y="145" fill="#f0f6fc" font-size="16" font-weight="700">DETECT</text>
    <text x="517" y="163" fill="#8b949e" font-size="12">objects · regions · evidence</text>

    <circle cx="749" cy="111" r="13" fill="url(#accent)"/>
    <text x="749" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">04</text>
    <text x="739" y="145" fill="#f0f6fc" font-size="16" font-weight="700">REVIEW</text>
    <text x="739" y="163" fill="#8b949e" font-size="12">agents · specialists · rules</text>

    <circle cx="971" cy="111" r="13" fill="url(#accent)"/>
    <text x="971" y="116" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">05</text>
    <text x="961" y="145" fill="#f0f6fc" font-size="16" font-weight="700">TRACEABLE OUTPUT</text>
    <text x="961" y="163" fill="#d0d7de" font-size="12">decision · evidence · audit trail</text>
  </g>
</svg>
